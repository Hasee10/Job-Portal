name: Market Scraper

# Runs every 12 hours on GitHub's own cloud runners, same cadence as the job
# scraper (see scrape.yml). Writes to market_* Supabase tables only - fully
# separate from job-portal data, see market-scraper/migrations/001_create_market_tables.sql.
on:
  schedule:
    - cron: "30 */12 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: market-scraper
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: market-scraper/package-lock.json

      - name: Install dependencies
        run: npm install --prefer-offline

      - name: Install Chromium OS dependencies (for CloakBrowser)
        run: npx playwright-core install-deps chromium

      - name: Run market scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLOAKBROWSER_LICENSE_KEY: ${{ secrets.CLOAKBROWSER_LICENSE_KEY }}
          SCRAPER_PROXY: ${{ secrets.SCRAPER_PROXY }}
          PRICEOYE_CATEGORIES: mobiles,laptops
          TELEMART_COLLECTIONS: mobiles-tablets,laptops-1
          SHOPHIVE_CATEGORIES: apple/iphone,laptops
          ISHOPPING_CATEGORIES: mobiles,laptops
        run: npm run start
