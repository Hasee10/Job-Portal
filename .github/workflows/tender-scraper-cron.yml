name: Tender Scraper

# Daily aggregation of external tender notices - TED (EU Tenders
# Electronic Daily) and PPRA (Pakistan's federal procurement authority) -
# into public.scraped_tenders, browsable at /procurement/tenders. Separate
# from the Job Scraper workflow since it's a different domain (tenders, not
# jobs) and a different table - kept independent so a failure/change in one
# never blocks the other. Adding another source is a new module under
# scripts/tender-scraper/sources/ plus one line in index.ts's SOURCES list -
# nothing here needs to change.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  scrape-tenders:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: bordful-main
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --prefer-offline

      - name: Run tender scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/tender-scraper/index.ts
